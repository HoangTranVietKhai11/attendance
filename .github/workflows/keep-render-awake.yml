name: Keep Render backend awake

on:
  schedule:
    # Render free services sleep after inactivity. GitHub-hosted runners call the
    # public health endpoint every 10 minutes during the configured schedule.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        env:
          HEALTH_URL: https://attendance-v5v6.onrender.com/health
        run: |
          curl --fail --silent --show-error --max-time 60 "$HEALTH_URL"
          printf '\nRender backend is reachable.\n'