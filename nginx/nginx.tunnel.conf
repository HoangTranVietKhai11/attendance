# MondayCheck — nginx cho chế độ Cloudflare Tunnel (không cần IP public).
#
# Luồng: điện thoại --HTTPS--> Cloudflare --tunnel--> cloudflared (10.250.250.250)
#        --HTTP--> nginx --> backend/frontend.
#
# `set_real_ip_from` chỉ tin container cloudflared trong compose; client khác
# (LAN/Tailscale) không thể giả CF-Connecting-IP để vượt chốt Wi-Fi.
#
# Cách dùng: cp nginx/nginx.tunnel.conf nginx/nginx.conf (backup file cũ), rồi
# docker compose --profile tunnel up -d && docker compose restart nginx

upstream backend { server backend:4000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    # Cloudflare Tunnel container (xem docker-compose.yml).
    set_real_ip_from 10.250.250.250;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr is now the real client IP restored from CF-Connecting-IP.
        # Overwrite (never append) so clients cannot spoof X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
