# MondayCheck Nginx reverse proxy
# For production: place TLS certs in ./nginx/certs/ and enable the HTTPS server block.

upstream backend { server backend:4000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    # Let's Encrypt webroot (certbot writes here — see DEPLOYMENT.md).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP enforced -> HTTPS in production. Uncomment below for HTTPS enforcement:
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append) so a client cannot spoof its IP with a fake
        # X-Forwarded-For header and bypass the check-in network allow-list.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SPA history fallback (try_files) is handled by the frontend container's nginx.
    }
}

# HTTPS server block (production). Obtain certs (e.g. Let's Encrypt) and place in ./nginx/certs/:
