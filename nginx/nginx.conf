# MondayCheck Nginx reverse proxy
# For production: place TLS certs in ./nginx/certs/ and enable the HTTPS server block.

# Docker's embedded DNS. Service names are resolved at request time (valid=10s) so a
# recreated container (`docker compose up -d --build backend`) does not leave nginx
# proxying the old container IP, which shows up as 502 Bad Gateway until nginx restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Let's Encrypt webroot (certbot writes here — see DEPLOYMENT.md).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP enforced -> HTTPS in production. Uncomment below for HTTPS enforcement:
    # return 301 https://$host$request_uri;

    location /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append) so a client cannot spoof its IP with a fake
        # X-Forwarded-For header and bypass the check-in network allow-list.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SPA history fallback (try_files) is handled by the frontend container's nginx.
    }
}

# HTTPS server block (production). Obtain certs (e.g. Let's Encrypt) and place in ./nginx/certs/:
# server {
#     listen 443 ssl;
#     server_name _;
#     ssl_certificate /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ... same location blocks ...
# }