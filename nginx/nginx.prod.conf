# MondayCheck — production reverse proxy (public VPS + domain + HTTPS).
#
# Cách dùng trên VPS:
#   1. Thay chamcong.example.com bằng domain thật (2 chỗ server_name).
#   2. Đặt fullchain.pem + privkey.pem vào ./nginx/certs/ (xem DEPLOYMENT.md mục 5).
#   3. cp nginx/nginx.prod.conf nginx/nginx.conf  (backup file cũ trước)
#   4. docker compose restart nginx
#
# Giữ nguyên `proxy_set_header X-Forwarded-For $remote_addr` để client không thể
# giả IP và vượt qua allow-list Wi-Fi.

upstream backend { server backend:4000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name chamcong.example.com;

    # ACME HTTP-01 (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name chamcong.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Express already limits JSON bodies to 2 MB.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): a client cannot spoof X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
