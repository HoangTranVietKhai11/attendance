services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mondaycheck}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/mondaycheck?schema=public}"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-secret}
      JWT_EXPIRES_IN: 8h
      BCRYPT_SALT_ROUNDS: 10
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://mondaycheck.onrender.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mondaycheck.onrender.com,http://localhost,http://localhost:5173,http://127.0.0.1}
      TRUSTED_PROXY: "true"
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:-127.0.0.1,::1,10.0.10.0/23}
      CHECKIN_RATE_LIMIT_MAX: ${CHECKIN_RATE_LIMIT_MAX:-10}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
      PUBLIC_IP: ${PUBLIC_IP:-}
      WIFI_NAME: ${WIFI_NAME:-Wi-Fi công ty}
      WIFI_PASSWORD: ${WIFI_PASSWORD:-}
      WIFI_INSTRUCTIONS: ${WIFI_INSTRUCTIONS:-}
      AUTO_SESSION_ENABLED: ${AUTO_SESSION_ENABLED:-false}
      AUTO_SESSION_NAME: ${AUTO_SESSION_NAME:-Sinh hoạt đầu giờ}
      AUTO_SESSION_START: ${AUTO_SESSION_START:-08:00}
      AUTO_SESSION_END: ${AUTO_SESSION_END:-11:00}
      AUTO_SESSION_TIMEZONE: ${AUTO_SESSION_TIMEZONE:-Asia/Ho_Chi_Minh}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-hr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      # Loopback only: the API must be reached through Nginx, otherwise a LAN client
      # could call :4000 directly and spoof X-Forwarded-For to fake the company network.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Leave empty to call the API same-origin (/api/...) through Nginx.
        # Set only when the API is served from a different origin.
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only: employees reach the SPA through Nginx (80/443); this port is
      # just a local debugging convenience and must not be exposed publicly.
      - "127.0.0.1:5173:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot
    networks:
      - default
      - tunnel

  # Cloudflare Tunnel: outbound-only, no public IP / port-forward needed.
  # Enable with: docker compose --profile tunnel up -d
  # Public hostname in Cloudflare must point to http://nginx:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      nginx:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      tunnel:
        # Fixed IP so nginx can trust CF-Connecting-IP only from this container.
        ipv4_address: 10.250.250.250

volumes:
  pgdata:

networks:
  tunnel:
    ipam:
      config:
        - subnet: 10.250.250.0/24